<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Registrasi Pelanggan</title>
    <link rel="stylesheet" href="registrasi.css">
</head>

<body>

<header>
    <h1>FilmSpace</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="Profile.html">Profile</a>
        <a href="Gallery.html">Gallery</a>
        <a href="About.html">About</a>
        <a href="Contact.html">Contact</a>
        <a href="subscription.html">Subscription</a>
        <a href="registrasi.html">Registrasi</a>
    </nav>
</header>

<main>

    <div class="registration">
        <h2>Registrasi Pelanggan</h2>

        <form>

            <label for="nama">Nama Lengkap</label>
            <input type="text" id="nama" name="nama"
                   placeholder="Masukkan nama lengkap" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email"
                   placeholder="Masukkan email" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   placeholder="Masukkan password" required>

            <label for="paket">Pilihan Paket</label>
            <select id="paket" name="paket" required>
                <option value="">-- Pilih Paket --</option>
                <option value="basic">Basic</option>
                <option value="standar">Standard</option>
                <option value="premium">Premium</option>
            </select>

            <label>Pilihan Pembayaran</label>

            <div class="payment">
                <input type="radio" id="kartu" name="pembayaran"
                       value="kartu" onclick="pilihKartu()">
                <label for="kartu">💳 Visa / Mastercard</label>
            </div>

            <div id="nomorKartu" class="hidden">
                <label for="nomor">Nomor Kartu</label>
                <input type="text" id="nomor"
                       placeholder="Masukkan nomor kartu">
            </div>

            <div class="payment">
                <input type="radio" id="dompet" name="pembayaran"
                       value="dompet" onclick="pilihDompet()">
                <label for="dompet">📱 Dompet Digital</label>
            </div>

            <div id="pilihanDompet" class="hidden">
                <label for="dompetDigital">Dompet Digital</label>

                <select id="dompetDigital">
                    <option value="">-- Pilih Dompet Digital --</option>
                    <option value="dana">DANA</option>
                    <option value="gopay">GoPay</option>
                    <option value="ovo">OVO</option>
                </select>
            </div>

            <button type="submit">Submit</button>

        </form>
    </div>

</main>

<footer>
    <p>&copy; 2026 FilmSpace. All Rights Reserved.</p>
</footer>

<script>
    function pilihKartu() {
        document.getElementById("nomorKartu").classList.remove("hidden");
        document.getElementById("pilihanDompet").classList.add("hidden");
    }

    function pilihDompet() {
        document.getElementById("pilihanDompet").classList.remove("hidden");
        document.getElementById("nomorKartu").classList.add("hidden");
    }
</script>

</body>
</html>
