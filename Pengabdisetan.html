<script src="https://www.youtube.com/iframe_api"></script>

<script>

var player;

function onYouTubeIframeAPIReady() {

    player = new YT.Player('PengabdisetanVideo', {
        width: '650',
        height: '365',
        videoId: '8LIHcd7WfWI'
    });

}

function playVideo() {
    player.playVideo();
}

function pauseVideo() {
    player.pauseVideo();
}

function smallVideo() {
    player.setSize(450, 253);
}

}
